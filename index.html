<!DOCTYPE html>

<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#66736b" />
    <title>PoemBook · 诗句收藏</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <!-- ==================== 侧边栏 ==================== -->

    <aside id="sidebar">
      ```
      <div class="sidebar-top">
        <div class="brand">
          <div class="brand-name">PoemBook</div>
          <div class="brand-subtitle">诗句收藏</div>
        </div>

        <nav class="main-nav">
          <button class="nav-item active" data-page="home">
            <span class="nav-icon">⌂</span>
            <span>首页</span>
          </button>

          <button class="nav-item" data-page="categories">
            <span class="nav-icon">◇</span>
            <span>分类</span>
          </button>

          <button class="nav-item" data-page="allPoems">
            <span class="nav-icon">▤</span>
            <span>全部诗句</span>
          </button>

          <button class="nav-item" data-page="authors">
            <span class="nav-icon">人</span>
            <span>作者</span>
          </button>
        </nav>
      </div>

      <div class="sidebar-bottom">
        <div class="collection-info">
          <span>我的收藏</span>
          <strong id="poemCount">0</strong>
        </div>

        <div class="theme-section">
          <div class="theme-label">主题</div>

          <div id="themeSelector">
            <button
              class="color-btn active"
              data-color="#66736b"
              style="--color: #66736b"
              aria-label="竹青"
              title="竹青"
            ></button>

            <button
              class="color-btn"
              data-color="#596b7a"
              style="--color: #596b7a"
              aria-label="黛蓝"
              title="黛蓝"
            ></button>

            <button
              class="color-btn"
              data-color="#9a7560"
              style="--color: #9a7560"
              aria-label="赭石"
              title="赭石"
            ></button>

            <button
              class="color-btn"
              data-color="#8a8067"
              style="--color: #8a8067"
              aria-label="茶褐"
              title="茶褐"
            ></button>

            <button
              class="color-btn"
              data-color="#8c6f7a"
              style="--color: #8c6f7a"
              aria-label="紫灰"
              title="紫灰"
            ></button>
          </div>
        </div>
      </div>
      ```
    </aside>

    <!-- ==================== 移动端 / 侧栏开关 ==================== -->

    <button
      id="toggleSidebarBtn"
      class="menu-button"
      aria-label="打开菜单"
      title="菜单"
    >
      ``` ☰ ```
    </button>

    <!-- ==================== 页面主体 ==================== -->

    <main id="main">
      ```
      <!-- ==================== 首页 ==================== -->

      <section id="home" class="page active">
        <header class="home-header">
          <div class="home-heading">
            <p class="eyebrow">POEMBOOK</p>
            <h1>我的诗句收藏</h1>
            <p class="home-description">
              那些曾经让我停下来读过的句子，都留在这里。
            </p>
          </div>

          <button id="toggleAddFormBtn" class="primary-button">
            <span>＋</span>
            收藏诗句
          </button>
        </header>

        <!-- 搜索 -->

        <div class="search-wrapper">
          <span class="search-icon">⌕</span>

          <input
            type="text"
            id="searchInput"
            placeholder="搜索诗句、诗名或作者……"
            autocomplete="off"
          />

          <button
            id="clearSearchBtn"
            class="clear-search"
            type="button"
            aria-label="清除搜索"
          >
            ×
          </button>
        </div>

        <!-- ==================== 添加诗句 ==================== -->

        <form id="addPoemForm" class="poem-form">
          <div class="form-heading">
            <div>
              <p class="form-eyebrow">NEW COLLECTION</p>
              <h2>收藏一首诗</h2>
            </div>

            <button
              type="button"
              id="closeAddFormBtn"
              class="form-close"
              aria-label="关闭"
            >
              ×
            </button>
          </div>

          <div class="form-group featured-field">
            <label for="newLine">你喜欢的句子</label>

            <textarea
              id="newLine"
              rows="3"
              required
              placeholder="摘下这一首诗里最想留下的句子……"
            ></textarea>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="newTitle">诗名</label>

              <input
                type="text"
                id="newTitle"
                required
                placeholder="原诗名称"
              />
            </div>

            <div class="form-group">
              <label for="newAuthor">作者</label>

              <input type="text" id="newAuthor" required placeholder="作者" />
            </div>
          </div>

          <div class="form-group">
            <label for="newCategory">分类</label>

            <select id="newCategory" required>
              <option value="" disabled selected>选择一个分类</option>
            </select>
          </div>

          <div class="form-group">
            <label for="newFull">全文</label>

            <textarea
              id="newFull"
              rows="8"
              required
              placeholder="在这里输入完整诗文……"
            ></textarea>
          </div>

          <div class="form-actions">
            <button type="button" id="cancelAddBtn" class="secondary-button">
              取消
            </button>

            <button type="submit" class="primary-button">保存收藏</button>
          </div>
        </form>

        <!-- ==================== 当前筛选提示 ==================== -->

        <div id="filterInfo" class="filter-info hidden">
          <span id="filterText"></span>

          <button id="clearFilterBtn" type="button">清除筛选</button>
        </div>

        <!-- ==================== 诗句卡片 ==================== -->

        <div id="poemList" class="poem-card-container"></div>

        <!-- 空状态 -->

        <div id="emptyState" class="empty-state hidden">
          <div class="empty-mark">「 」</div>

          <h3>这里还没有诗句</h3>

          <p>收藏一句你喜欢的话，让这本诗句簿慢慢长起来。</p>

          <button id="emptyAddBtn" class="secondary-button" type="button">
            收藏第一句
          </button>
        </div>
      </section>

      <!-- ==================== 分类 ==================== -->

      <section id="categories" class="page">
        <header class="page-header">
          <div>
            <p class="eyebrow">CATEGORIES</p>
            <h1>分类</h1>
            <p>按照你自己的方式整理这些诗句。</p>
          </div>

          <button
            id="manageCategoriesBtn"
            class="secondary-button"
            type="button"
          >
            管理分类
          </button>
        </header>

        <div id="categoryList" class="category-grid"></div>
      </section>

      <!-- ==================== 全部诗句 ==================== -->

      <section id="allPoems" class="page">
        <header class="page-header">
          <div>
            <p class="eyebrow">ALL POEMS</p>
            <h1>全部诗句</h1>
            <p>你收藏过的所有诗句。</p>
          </div>
        </header>

        <div id="allPoemList" class="all-poem-list"></div>
      </section>

      <!-- ==================== 作者 ==================== -->

      <section id="authors" class="page">
        <header class="page-header">
          <div>
            <p class="eyebrow">AUTHORS</p>
            <h1>作者</h1>
            <p>看看哪些文字曾经被你留下。</p>
          </div>
        </header>

        <div id="authorList" class="author-grid"></div>
      </section>
      ```
    </main>

    <!-- ==================== 分类管理弹窗 ==================== -->

    <div id="categoryModal" class="modal-overlay">
      ```
      <div class="modal category-modal">
        <div class="modal-header">
          <div>
            <p class="form-eyebrow">CATEGORIES</p>
            <h2>管理分类</h2>
          </div>

          <button
            class="close-modal modal-close"
            type="button"
            aria-label="关闭"
          >
            ×
          </button>
        </div>

        <div id="currentCategories" class="current-categories">
          <!-- JS 动态生成 -->
        </div>

        <form id="addCategoryForm" class="add-category-form">
          <input
            type="text"
            id="newCategoryName"
            placeholder="输入新的分类名称"
            autocomplete="off"
          />

          <button type="submit" class="primary-button">添加</button>
        </form>
      </div>
      ```
    </div>

    <!-- ==================== 编辑诗句弹窗 ==================== -->

    <div id="editPoemModal" class="modal-overlay">
      ```
      <div class="modal edit-modal">
        <div class="modal-header">
          <div>
            <p class="form-eyebrow">EDIT COLLECTION</p>
            <h2>修改诗句</h2>
          </div>

          <button
            class="close-edit-modal modal-close"
            type="button"
            aria-label="关闭"
          >
            ×
          </button>
        </div>

        <form id="editPoemForm">
          <input type="hidden" id="editPoemId" />

          <div class="form-group featured-field">
            <label for="editLine">你喜欢的句子</label>

            <textarea id="editLine" rows="3" required></textarea>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="editTitle">诗名</label>

              <input type="text" id="editTitle" required />
            </div>

            <div class="form-group">
              <label for="editAuthor">作者</label>

              <input type="text" id="editAuthor" required />
            </div>
          </div>

          <div class="form-group">
            <label for="editCategory">分类</label>

            <select id="editCategory" required></select>
          </div>

          <div class="form-group">
            <label for="editFull">全文</label>

            <textarea id="editFull" rows="8" required></textarea>
          </div>

          <div class="form-actions">
            <button type="button" id="cancelEditBtn" class="secondary-button">
              取消
            </button>

            <button type="submit" class="primary-button">保存修改</button>
          </div>
        </form>
      </div>
      ```
    </div>

    <!-- ==================== Toast 提示 ==================== -->

    <div id="toast" class="toast"></div>

    <script src="script.js"></script>
  </body>
</html>
